# Metadata, dependencies and tool settings (ruff, pytest) of banking-dataops-monitoring. Read by pip
# (make install, the Dockerfile, ci.yml), by ruff and by pytest.
# requirements.txt mirrors [project].dependencies: tests/test_config.py fails when they differ.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-dataops-monitoring"
version = "0.1.0"
description = "Synthetic regulated-data monitoring lab with PostgreSQL, SQL controls, Python and Streamlit."
requires-python = ">=3.12"
# Lower bounds only. `make lock` writes the exact versions installed in the app image to
# requirements.lock; nothing in the repository installs from that file today.
dependencies = [
    "psycopg[binary]>=3.1",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "streamlit>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.7,<4",
]

# Installed by `make install` and by ci.yml (`pip install -e ".[dev]"`). The Dockerfile does not
# install this extra.
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

# Only the banking_dataops package is installed. src/ingestion, src/cleaning, src/transformations
# and src/ml are path aliases that re-export from banking_dataops (src/README.md): they resolve
# from the source tree but are left out of the installed distribution, because `ml` and `cleaning`
# are too generic to claim as top-level names in site-packages.
[tool.setuptools.packages.find]
where = ["src"]
include = ["banking_dataops*"]

# notebooks/ is excluded rather than rewritten: without the exclusion, ruff reports E402 (imports
# after other statements) in notebooks/01_eda_bronze.ipynb.
[tool.ruff]
line-length = 120
extend-exclude = ["notebooks/"]
target-version = "py312"

# The rule set is written here rather than left to the defaults of the installed ruff version:
# the `dev` extra installs `ruff` without a version bound, so a default could change under the CI.
# E, F, I, B, SLF, UP and W are the rules of the quality gate applied in October 2026 (zero finding on
# src, tests and scripts); SIM is kept from the earlier configuration.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports and variables, real errors
    "I",    # isort: import order
    "B",    # flake8-bugbear: common traps
    "SLF",  # flake8-self: no access to a private member of another object
    "UP",   # pyupgrade: modern syntax
    "SIM",  # flake8-simplify
]
ignore = [
    # SIM117: nested `with`, here a connection then a cursor (db.py, demo_scenario.py, ingest.py).
    # ruff reports them; the nested form is kept because each level has its own comment and scope.
    "SIM117",
]

# Type checking: `mypy --strict src` (run by hand; the CI does not run it yet). scikit-learn and joblib
# ship no type information, so their imports are left untyped instead of being reported on every line.
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib"]
ignore_missing_imports = true

# With `pythonpath = ["src"]`, tests import banking_dataops from src/ even without an installation.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A test is failed after 8 s unless marked @pytest.mark.limit(seconds) (tests/conftest.py).
markers = [
    "limit(seconds): time limit of one test, in seconds (default 8)",
]

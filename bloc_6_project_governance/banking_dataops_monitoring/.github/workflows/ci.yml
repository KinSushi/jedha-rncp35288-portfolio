# Standard CI, on every push and pull request: install the package with the dev extra, then the
# same two commands as `make ci` (ruff, then pytest). Python 3.12, as in the Dockerfile.
# There is no PostgreSQL here: the suite runs without a database, so the SQL controls are not
# executed by this workflow (README, "Validation evidence"). They run in the local pipeline and in
# the smoke check.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

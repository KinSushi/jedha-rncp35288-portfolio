name: portfolio-content-validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
      - 'docs/screenshots.md'
      - 'docs/local_run_report.md'

permissions:
  contents: write

jobs:
  validate-and-capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public evidence structure
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import datetime as dt
          import html

          root = Path.cwd()
          screenshots = root / "docs" / "screenshots"
          screenshots.mkdir(parents=True, exist_ok=True)
          results: list[dict[str, object]] = []

          def add_result(name: str, status: str, output: str, exit_code: int = 0) -> None:
              results.append(
                  {
                      "name": name,
                      "status": status,
                      "exit": exit_code,
                      "duration": 0,
                      "output": output,
                  }
              )

          required_files = [
              "README.md",
              "PORTFOLIO.md",
              "docs/certification_mapping.md",
              "docs/evidence_index.md",
              "docs/public_safety_rules.md",
              "docs/portfolio_review_checklist.md",
              "bloc_1_data_infrastructure/README.md",
              "bloc_2_eda_statistics/README.md",
              "bloc_3_machine_learning/README.md",
              "bloc_4_nlp_deep_learning/README.md",
              "bloc_5_mlops_deployment/README.md",
              "bloc_6_project_governance/README.md",
          ]
          missing = [path for path in required_files if not (root / path).exists()]
          add_result(
              "required-file-checks",
              "PASS" if not missing else "FAIL",
              "All required public evidence files exist." if not missing else "Missing:\n" + "\n".join(missing),
              0 if not missing else 1,
          )

          required_dirs = [
              "bloc_1_data_infrastructure",
              "bloc_2_eda_statistics",
              "bloc_3_machine_learning",
              "bloc_4_nlp_deep_learning",
              "bloc_5_mlops_deployment",
              "bloc_6_project_governance",
              "docs/templates",
          ]
          missing_dirs = [path for path in required_dirs if not (root / path).is_dir()]
          add_result(
              "six-block-folder-checks",
              "PASS" if not missing_dirs else "FAIL",
              "All six block folders exist." if not missing_dirs else "Missing directories:\n" + "\n".join(missing_dirs),
              0 if not missing_dirs else 1,
          )

          forbidden_extensions = {".pdf", ".docx", ".xlsx", ".pptx"}
          forbidden_extension_hits = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() in forbidden_extensions:
                  forbidden_extension_hits.append(str(path.relative_to(root)))
          add_result(
              "private-document-extension-scan",
              "PASS" if not forbidden_extension_hits else "FAIL",
              "No private document extensions found."
              if not forbidden_extension_hits
              else "Forbidden files:\n" + "\n".join(forbidden_extension_hits),
              0 if not forbidden_extension_hits else 1,
          )

          forbidden_folders = {
              "private",
              "school_documents",
              "certificates_private",
              "grades",
              "exam_subjects",
              "exam_answers",
              "cpf",
              "contracts",
              "invoices",
              "applications",
              "cover-letters",
              "job-tracker",
              "salary",
          }
          forbidden_folder_hits = []
          for path in root.rglob("*"):
              if ".git" in path.parts:
                  continue
              if any(part in forbidden_folders for part in path.parts):
                  forbidden_folder_hits.append(str(path.relative_to(root)))
          add_result(
              "private-folder-scan",
              "PASS" if not forbidden_folder_hits else "FAIL",
              "No forbidden private folders found."
              if not forbidden_folder_hits
              else "Forbidden paths:\n" + "\n".join(forbidden_folder_hits[:100]),
              0 if not forbidden_folder_hits else 1,
          )

          evidence_index = root / "docs" / "evidence_index.md"
          evidence_text = evidence_index.read_text(encoding="utf-8", errors="replace") if evidence_index.exists() else ""
          expected_blocks = ["Bloc 1", "Bloc 2", "Bloc 3", "Bloc 4", "Bloc 5", "Bloc 6"]
          missing_block_refs = [block for block in expected_blocks if block not in evidence_text]
          add_result(
              "evidence-index-block-coverage",
              "PASS" if not missing_block_refs else "FAIL",
              "Evidence index references all six blocks."
              if not missing_block_refs
              else "Missing block references:\n" + "\n".join(missing_block_refs),
              0 if not missing_block_refs else 1,
          )

          report_lines = [
              "# Local Run Report",
              "",
              f"Generated by GitHub Actions on {dt.datetime.utcnow().isoformat(timespec='seconds')}Z",
              "",
              "| Step | Status | Exit | Duration |",
              "|---|---:|---:|---:|",
          ]
          for result in results:
              report_lines.append(
                  f"| {result['name']} | {result['status']} | {result['exit']} | {result['duration']}s |"
              )
          report_lines.extend(["", "## Detailed outputs", ""])
          for result in results:
              report_lines.extend(
                  [
                      f"### {result['name']} - {result['status']}",
                      "",
                      "```text",
                      str(result["output"]),
                      "```",
                      "",
                  ]
              )
          (root / "docs" / "local_run_report.md").write_text("\n".join(report_lines), encoding="utf-8")

          summary_text = "\n".join(f"{r['name']}: {r['status']} exit={r['exit']}" for r in results)
          y = 90
          nodes = []
          for line in summary_text.splitlines()[:28]:
              nodes.append(f'<text x="60" y="{y}" class="mono">{html.escape(line[:120])}</text>')
              y += 26
          svg = f'''<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="jedha-rncp35288-portfolio validation preview">
          <defs><style>.title{{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:750;fill:#fff}}.sub{{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#9FB3C8}}.mono{{font-family:Consolas,Menlo,monospace;font-size:18px;fill:#D8E2F0}}</style></defs>
          <rect width="1280" height="900" rx="26" fill="#07111F"/>
          <text x="60" y="52" class="title">jedha-rncp35288-portfolio</text>
          <text x="60" y="78" class="sub">Public evidence validation - six blocks and safety boundary</text>
          {''.join(nodes)}
          </svg>'''
          (screenshots / "validation-preview.svg").write_text(svg, encoding="utf-8")
          html_report = "<!doctype html><meta charset='utf-8'><pre>" + html.escape("\n".join(report_lines)) + "</pre>"
          (screenshots / "validation-output.html").write_text(html_report, encoding="utf-8")
          (root / "docs" / "screenshots.md").write_text(
              "# Screenshots and content previews\n\n"
              "Generated from public evidence validation in GitHub Actions.\n\n"
              "- [validation-preview.svg](screenshots/validation-preview.svg)\n"
              "- [validation-output.html](screenshots/validation-output.html)\n",
              encoding="utf-8",
          )

          if any(result["status"] == "FAIL" for result in results):
              Path("validation_failed.flag").write_text(
                  "\n".join(str(r["name"]) for r in results if r["status"] == "FAIL"),
                  encoding="utf-8",
              )
          PY

      - name: Commit generated reports and previews
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/local_run_report.md docs/screenshots.md docs/screenshots || true
          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
          else
            git commit -m "docs: update generated validation report and previews [skip ci]"
            git push
          fi

      - name: Fail if validation failed
        shell: bash
        run: |
          if [ -f validation_failed.flag ]; then
            echo "Validation failed steps:"
            cat validation_failed.flag
            exit 1
          fi

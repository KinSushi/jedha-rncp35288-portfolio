# Métadonnées du projet, dépendances et réglages des outils (ruff, pytest).

[project]
name = "detection-fraude"
version = "1.0.0"
description = "Pipeline de détection automatique de fraude : flux temps réel, rapport du matin, réentraînement."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    # < 2.1 : SQLAlchemy 2.1 déprécie la stratégie « noload » que MLflow 3.17 emploie encore ;
    # la production tourne déjà en 1.4.54 (contraintes Airflow 2.10.5). Voir README.md.
    "sqlalchemy>=1.4.50,<2.1",
    "mlflow-skinny>=2.14",
    "alembic>=1.13",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
# Production : file Kafka (compatible Redpanda) et PostgreSQL.
prod = [
    "confluent-kafka>=2.4",
    "psycopg2-binary>=2.9",
]
# Développement : tests et qualité du code.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "pendulum>=3.0",
    "dill>=0.3.8",
]

[tool.setuptools]
packages = ["detection_fraude"]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["data", "donnees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "C4", "SLF"]
# N818 : les exceptions du projet portent le préfixe « Erreur » (convention française).
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::FutureWarning:mlflow.*",
]

[tool.mypy]
python_version = "3.12"
strict = true
# Les stubs d'Airflow (installé seulement dans l'image Docker, pas sous Windows) sont dans stubs/.
mypy_path = "stubs"

[[tool.mypy.overrides]]
# scikit-learn ne livre ni types ni marqueur py.typed, et il n'existe pas de paquet de stubs
# maintenu : seul ce module est exempté de l'erreur « import-untyped » (pas les autres).
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

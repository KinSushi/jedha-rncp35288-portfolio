  <text x="72" y="88" class="title">Jedha RNCP35288 - evidence validation output</text><text x="72" y="122" class="sub">Public sanitized six-block evidence structure</text><rect x="1120" y="68" width="184" height="32" rx="16" fill="#6E40C9"/><text x="1142" y="90" class="badge">public evidence</text>
  <text x="72" y="162" class="mono">Required public files:</text><text x="92" y="192" class="mono">README.md</text><text x="92" y="222" class="mono">PORTFOLIO.md</text><text x="92" y="252" class="mono">docs/evidence_index.md</text><text x="92" y="282" class="mono">docs/public_safety_rules.md</text>
  <text x="72" y="342" class="mono">Six-block structure:</text><text x="92" y="372" class="mono">Bloc 1 - Data infrastructure</text><text x="92" y="402" class="mono">Bloc 2 - EDA / statistics</text><text x="92" y="432" class="mono">Bloc 3 - Machine learning</text><text x="92" y="462" class="mono">Bloc 4 - NLP / deep learning</text><text x="92" y="492" class="mono">Bloc 5 - Industrialization / MLOps</text><text x="92" y="522" class="mono">Bloc 6 - Project governance</text>
  <text x="72" y="582" class="mono">Public boundary:</text><text x="92" y="612" class="mono">- no private school documents</text><text x="92" y="642" class="mono">- no exam material</text><text x="92" y="672" class="mono">- no grades or private certificates</text><text x="92" y="702" class="mono">- no application material</text><text x="92" y="732" class="mono">- no real client or employer data</text>
  <text x="72" y="824" class="small">Generated from repository structure and public-safety validation plan. No private documents.</text>

[project]
name = "att-spam"
version = "1.0.0"
description = "Détecteur de SMS indésirables (AT&T), bloc 4 CDSD, apprentissage profond"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "notebook: exécute le notebook en entier avec nbclient (environ 30 minutes sur processeur)",
]

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4da6ff"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8b64c"/>
    </marker>
    <marker id="arwm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ba3bf"/>
    </marker>
  </defs>

  <rect width="1180" height="700" fill="#0d1b2a"/>

  <text x="40" y="46" font-size="25" font-weight="700" fill="#e8edf4">banking-dataops-monitoring</text>
  <text x="40" y="70" font-size="14" fill="#8ba3bf">Pipeline médaillon · contrôle qualité · verdict de publication</text>
  <text x="1140" y="46" font-size="12.5" fill="#e8b64c" text-anchor="end">seed=42 · déterministe · idempotent</text>

  <!-- ============ COUCHES MEDAILLON ============ -->
  <text x="40" y="116" font-size="12" font-weight="700" fill="#8ba3bf" letter-spacing="1.6">COUCHES DE DONNÉES</text>

  <!-- BRONZE -->
  <rect x="40" y="132" width="228" height="132" rx="10" fill="#1a2f45" stroke="#cd7f32" stroke-width="2"/>
  <circle cx="66" cy="160" r="9" fill="#cd7f32"/>
  <text x="84" y="165" font-size="16.5" font-weight="700" fill="#e8edf4">BRONZE</text>
  <text x="58" y="190" font-size="12.5" fill="#8ba3bf">Données synthétiques brutes</text>
  <text x="58" y="211" font-size="12.5" fill="#e8edf4">CSV · 1 500 transactions</text>
  <text x="58" y="230" font-size="12.5" fill="#e8edf4">100 clients · 200 comptes</text>
  <text x="58" y="251" font-size="11.5" fill="#e8b64c">fingerprint 89ac138fb9943f00</text>

  <!-- SILVER -->
  <rect x="316" y="132" width="228" height="132" rx="10" fill="#1a2f45" stroke="#aab7c4" stroke-width="2"/>
  <circle cx="342" cy="160" r="9" fill="#aab7c4"/>
  <text x="360" y="165" font-size="16.5" font-weight="700" fill="#e8edf4">SILVER</text>
  <text x="334" y="190" font-size="12.5" fill="#8ba3bf">Typé, contraint, contrôlé</text>
  <text x="334" y="211" font-size="12.5" fill="#e8edf4">PostgreSQL · 1 500 lignes</text>
  <text x="334" y="230" font-size="12.5" fill="#e8edf4">0 doublon · 0 quarantaine</text>
  <text x="334" y="251" font-size="11.5" fill="#8ba3bf">anomalies métier conservées</text>

  <!-- GOLD -->
  <rect x="592" y="132" width="228" height="132" rx="10" fill="#1a2f45" stroke="#e8b64c" stroke-width="2"/>
  <circle cx="618" cy="160" r="9" fill="#e8b64c"/>
  <text x="636" y="165" font-size="16.5" font-weight="700" fill="#e8edf4">GOLD</text>
  <text x="610" y="190" font-size="12.5" fill="#8ba3bf">Schéma en étoile</text>
  <text x="610" y="211" font-size="12.5" fill="#e8edf4">4 dimensions · 2 faits</text>
  <text x="610" y="230" font-size="12.5" fill="#e8edf4">1 500 faits · 107 dates</text>
  <text x="610" y="251" font-size="11.5" fill="#8ba3bf">truncate-then-insert</text>

  <!-- ML -->
  <rect x="868" y="132" width="272" height="132" rx="10" fill="#1a2f45" stroke="#4da6ff" stroke-width="2"/>
  <circle cx="894" cy="160" r="9" fill="#4da6ff"/>
  <text x="912" y="165" font-size="16.5" font-weight="700" fill="#e8edf4">ML — PRIORISATION</text>
  <text x="886" y="190" font-size="12.5" fill="#8ba3bf">13 variables dérivées</text>
  <text x="886" y="211" font-size="12.5" fill="#3ddc84">régression logistique · AUC 0,970</text>
  <text x="886" y="230" font-size="12.5" fill="#8ba3bf">forêt tunée rejetée · AUC 0,957</text>
  <text x="886" y="251" font-size="11.5" fill="#e8b64c">le simple gagne, et c'est tracé</text>

  <!-- Flèches entre couches -->
  <line x1="272" y1="198" x2="310" y2="198" stroke="#4da6ff" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="548" y1="198" x2="586" y2="198" stroke="#4da6ff" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="824" y1="198" x2="862" y2="198" stroke="#4da6ff" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="291" y="190" font-size="10.5" fill="#8ba3bf" text-anchor="middle">COPY</text>
  <text x="567" y="190" font-size="10.5" fill="#8ba3bf" text-anchor="middle">build</text>
  <text x="843" y="190" font-size="10.5" fill="#8ba3bf" text-anchor="middle">train</text>

  <!-- ============ COUCHE DE CONTROLE ============ -->
  <text x="40" y="316" font-size="12" font-weight="700" fill="#8ba3bf" letter-spacing="1.6">COUCHE DE CONTRÔLE — DÉTERMINISTE</text>

  <rect x="40" y="332" width="780" height="104" rx="10" fill="#16283c" stroke="#3ddc84" stroke-width="2"/>
  <text x="62" y="360" font-size="15.5" font-weight="700" fill="#e8edf4">7 contrôles qualité</text>
  <text x="62" y="381" font-size="12" fill="#8ba3bf">CTRL-001 nuls critiques · CTRL-002 doublons · CTRL-003 montants</text>
  <text x="62" y="399" font-size="12" fill="#8ba3bf">CTRL-004 orphelins · CTRL-005 score de risque · CTRL-006 statut</text>
  <text x="62" y="420" font-size="12" fill="#e8b64c">CTRL-007 fraîcheur : WARN · 6 PASS · 0 ligne en violation</text>

  <rect x="560" y="344" width="242" height="80" rx="8" fill="#0d1b2a" stroke="#e8b64c" stroke-width="1.5"/>
  <text x="681" y="367" font-size="12" fill="#8ba3bf" text-anchor="middle">VERDICT DE PUBLICATION</text>
  <text x="681" y="396" font-size="20" font-weight="700" fill="#e8b64c" text-anchor="middle">WARN · can_publish</text>
  <text x="681" y="415" font-size="10.5" fill="#8ba3bf" text-anchor="middle">7/7 PASS avec --generated-at today</text>

  <!-- Barrière ADR-0002 -->
  <line x1="868" y1="300" x2="868" y2="452" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="884" y="338" font-size="12.5" font-weight="700" fill="#ff5c5c">ADR-0002</text>
  <text x="884" y="358" font-size="11.5" fill="#e8edf4">Le score du modèle</text>
  <text x="884" y="375" font-size="11.5" fill="#e8edf4">ne touche JAMAIS</text>
  <text x="884" y="392" font-size="11.5" fill="#e8edf4">le verdict.</text>
  <text x="884" y="414" font-size="11" fill="#8ba3bf">Le ML priorise,</text>
  <text x="884" y="430" font-size="11" fill="#8ba3bf">il ne décide pas.</text>

  <!-- Silver -> controles -->
  <path d="M 430 270 L 430 326" stroke="#3ddc84" stroke-width="2.5" fill="none" marker-end="url(#arw)"/>

  <!-- ============ JOURNAL D'AUDIT ============ -->
  <rect x="40" y="466" width="382" height="94" rx="10" fill="#16283c" stroke="#e8b64c" stroke-width="2"/>
  <text x="62" y="494" font-size="15.5" font-weight="700" fill="#e8edf4">Journal d'audit</text>
  <text x="62" y="516" font-size="12" fill="#8ba3bf">Tout événement porte une raison métier — contrainte en base</text>
  <text x="62" y="537" font-size="12" fill="#e8edf4">run_id corrélé · append-only · invariants vérifiés</text>
  <text x="62" y="554" font-size="11.5" fill="#e8b64c">267 événements · 0 sans raison</text>

  <path d="M 430 442 L 430 462 L 240 462" stroke="#e8b64c" stroke-width="2" fill="none" marker-end="url(#arwg)"/>

  <!-- ============ CONSOMMATEURS ============ -->
  <text x="470" y="482" font-size="12" font-weight="700" fill="#8ba3bf" letter-spacing="1.6">RESTITUTION</text>

  <rect x="470" y="496" width="206" height="64" rx="9" fill="#1a2f45" stroke="#4da6ff" stroke-width="1.6"/>
  <text x="490" y="521" font-size="14" font-weight="700" fill="#e8edf4">API FastAPI</text>
  <text x="490" y="542" font-size="11.5" fill="#8ba3bf">lecture seule · /verdict /health</text>

  <rect x="694" y="496" width="206" height="64" rx="9" fill="#1a2f45" stroke="#4da6ff" stroke-width="1.6"/>
  <text x="714" y="521" font-size="14" font-weight="700" fill="#e8edf4">Streamlit</text>
  <text x="714" y="542" font-size="11.5" fill="#8ba3bf">tableau de bord opérationnel</text>

  <rect x="918" y="496" width="222" height="64" rx="9" fill="#1a2f45" stroke="#e8b64c" stroke-width="1.6"/>
  <text x="938" y="521" font-size="14" font-weight="700" fill="#e8edf4">Power BI</text>
  <text x="938" y="542" font-size="11.5" fill="#8ba3bf">8 vues étoile · rapport .pbix</text>

  <path d="M 681 442 L 681 490" stroke="#4da6ff" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M 706 270 L 706 290 L 846 290 L 846 466 L 797 466 L 797 490" stroke="#8ba3bf" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arwm)"/>
  <path d="M 1004 270 L 1029 270 L 1029 490" stroke="#8ba3bf" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arwm)"/>

  <!-- ============ SOCLE ============ -->
  <rect x="40" y="590" width="1100" height="76" rx="10" fill="#16283c" stroke="#2c4159" stroke-width="1.6"/>
  <text x="62" y="616" font-size="12" font-weight="700" fill="#8ba3bf" letter-spacing="1.4">SOCLE TECHNIQUE &amp; GARANTIES</text>
  <text x="62" y="640" font-size="12.5" fill="#e8edf4">Python 3.12 · PostgreSQL 16 · Docker · psycopg 3 · scikit-learn · pytest</text>
  <text x="62" y="659" font-size="12.5" fill="#3ddc84">33 tests de chemins interdits · smoke check 15/15 · chargement rejouable (truncate puis insert)</text>

  <text x="1120" y="640" font-size="11.5" fill="#8ba3bf" text-anchor="end">Preuves : evidence/, 11 octobre 2026</text>
  <text x="1120" y="659" font-size="11.5" fill="#e8b64c" text-anchor="end">RNCP35288 · Bloc 6</text>
</svg>
